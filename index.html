<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GestorPro | ERP Restaurante</title>
<style>
:root{--navy:#14243a;--navy2:#1d3553;--blue:#2878c7;--bg:#f3f6fa;--card:#fff;--text:#1c2938;--muted:#718096;--line:#e5ebf2;--green:#16865b;--red:#c74747;--amber:#b7791f}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px Inter,system-ui,Segoe UI,Arial;color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:#fff;font-weight:650}button.secondary{background:#edf2f7;color:#26384c}button.danger{background:#fff0f0;color:#b83232}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff}.shell{display:flex;min-height:100vh}.sidebar{width:245px;background:var(--navy);color:#d9e4f0;padding:22px 14px;flex-shrink:0}.brand{font-size:19px;font-weight:800;color:#fff;padding:5px 10px 24px}.brand small{display:block;color:#8fa7c2;font-size:10px;letter-spacing:1.5px;margin-top:5px}.navlabel{font-size:10px;color:#7f96b2;text-transform:uppercase;letter-spacing:1.4px;padding:13px 10px 7px}.nav button{display:block;width:100%;text-align:left;background:transparent;color:#c6d3e2;padding:10px;margin:2px 0}.nav button.active,.nav button:hover{background:var(--navy2);color:white}.main{flex:1;min-width:0}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 25px}.content{padding:26px;max-width:1450px;margin:auto}.pagehead{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;margin-bottom:20px}.pagehead h1{margin:0;font-size:25px}.sub,.muted{color:var(--muted);margin-top:6px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px;box-shadow:0 2px 8px #15283c08}.kpi small{color:var(--muted);display:block}.kpi b{display:block;font-size:25px;margin:9px 0}.section{margin-top:18px}.notice{background:#eef6ff;border:1px solid #d7e8fb;padding:13px;border-radius:10px;color:#315b83;margin-bottom:16px}.pill{display:inline-block;padding:4px 8px;border-radius:20px;background:#edf4ff;color:#2765a2;font-size:11px}.green{color:var(--green)}.red{color:var(--red)}.tablew
rap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f9fbfd}.empty{padding:28px;text-align:center;color:var(--muted)}.authwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.authcard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 40px #15283c12}.authbrand{font-size:24px;font-weight:850;color:var(--navy)}.authbrand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.authactions{display:flex;gap:8px;flex-wrap:wrap}.authactions button{flex:1}.hidden{display:none!important}.status{margin-top:12px;font-size:13px;line-height:1.5}.topright{display:flex;align-items:center;gap:12px}.topright select{width:auto;max-width:230px}.topright span{color:var(--muted);font-size:12px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.content{padding:18px}}
@media(max-width:620px){.shell{display:block}.sidebar{width:100%;padding:12px}.brand{padding:4px 8px 12px}.nav{display:flex;overflow:auto;gap:5px}.navlabel{display:none}.nav button{white-space:nowrap;width:auto;font-size:12px;padding:8px}.top{padding:0 12px}.content{padding:15px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.pagehead{display:block}.topright span{display:none}}
</style>
</head>
<body>
<div id="authView" class="authwrap"><div class="authcard">
 <div class="authbrand">GESTORPRO<small>ERP RESTAURANTE</small></div>
 <h2 id="authTitle">Acesse sua conta</h2><p class="muted">Entre para acessar os dados seguros da sua empresa.</p>
 <form id="authForm"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="field hidden" id="nameField"><label>Nome completo</label><input id="fullName" autocomplete="name"></div><div class="authactions"><button id="loginBtn" type="submit">Entrar</button><button id="signupBtn" class="secondary" type="button">Criar conta</button></div></form>
 <div id="authStatus" class="status" role="status"></div>
 </div></div>
<div id="setupView" class="authwrap hidden"><div class="authcard"><div class="authbrand">GESTORPRO<small>CONFIGURAÇÃO INICIAL</small></div><h2>Cadastre sua empresa</h2><p class="muted">Este será o ambiente administrativo inicial da sua organização.</p><form id="setupForm"><div class="field"><label>Nome da empresa</label><input id="companyName" required maxlength="120" placeholder="Ex.: Minha Rede de Restaurantes"></div><div class="field"><label>Nome da primeira unidade</label><input id="unitName" required maxlength="120" placeholder="Ex.: Unidade Matriz"></div><button type="submit">Criar empresa e unidade</button></form><div id="setupStatus" class="status" role="status"></div><button class="secondary" id="setupLogout" type="button">Sair</button></div></div>
<div id="appView" class="shell hidden">
 <aside class="sidebar"><div class="brand">GESTORPRO<small>ERP RESTAURANTE</small></div><div class="navlabel">Gestão</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="cadastros">♙ &nbsp; Cadastros</button><button data-page="estoque">▣ &nbsp; Estoque</button><button data-page="compras">🛒 &nbsp; Compras</button><button data-page="operacao">☑ &nbsp; Operações</button></nav><div class="navlabel">Sistema</div><nav class="nav"><button data-page="ajuda">⚙ &nbsp; Sobre o sistema</button></nav></aside>
 <main class="main"><header class="top"><strong id="topTitle">Dashboard gerencial</strong><div class="topright"><select id="unitSelect" aria-label="Selecionar unidade"></select><span id="userLabel"></span><button class="secondary" id="logoutBtn">Sair</button></div></header><div class="content" id="app"></div></main>
</div>
<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const SUPABASE_URL='https://rtkohwkhbfxcqyyivlav.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_EfsK97hZ0JfeSGl2Lb7GcQ_wl1jy1UV';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
let session=null, memberships=[], units=[], companyId=null, unitId=null, currentPage='dashboard';
const titles={dashboard:'Dashboard gerencial',cadastros:'Cadastros',estoque:'Controle de estoque',compras:'Compras',operacao:'Operações',ajuda:'Sobre o sistema'};
function status(id,msg,kind=''){const el=$(id);el.textContent=msg;el.className='status '+kind}
function show(view){['authView','setupView','appView'].forEach(id=>$(id).classList.toggle('hidden',id!==view))}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
$('authForm').addEventListener('submit',async e=>{e.preventDefault();status('authStatus','Conectando...');const {data,error}=await supabase.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){status('authStatus',error.message,'red');return}session=data.session;await bootstrap()});
$('signupBtn').addEventListener('click',async()=>{const name=$('fullName').value.trim();if(!name){$('nameField').classList.remove('hidden');$('fullName').required=true;status('authStatus','Informe seu nome completo e toque em Criar conta novamente.');return}status('authStatus','Criando conta...');const {data,error}=await supabase.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:name}}});if(error){status('authStatus',error.message,'red');return}if(data.session){session=data.session;await bootstrap()}else{status('authStatus','Conta criada. Confirme o e-mail pelo link enviado e depois volte para entrar.','green')}});
async function bootstrap(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){show('authView');return}const {data:mem,error}=await supabase.from('company_memberships').select('company_id,role,companies(id,name)').eq('user_id',session.user.id);if(error){show('authView');status('authStatus','Não foi possível carregar seu acesso: '+error.message,'red');return}memberships=mem||[];if(!memberships.length){show('setupView');return}companyId=memberships[0].company_id;await loadUnits()}
$('setupForm').addEventListener('submit',async e=>{e.preventDefault();if(!session){show('authView');return}status('setupStatus','Criando empresa...');const name=$('companyName').value.trim(),unitName=$('unitName').value.trim();const {data:company,error:ce}=await supabase.from('companies').insert({name,owner_id:session.user.id}).select('id,name').single();if(ce){status('setupStatus','Erro ao criar empresa: '+ce.message,'red');return}const {error:me}=await supabase.from('company_memberships').insert({company_id:company.id,user_id:session.user.id,role:'admin'});if(me){status('setupStatus','Empresa criada, mas não foi possível criar seu vínculo de administrador: '+me.message+'. Não tente criar outra empresa; peça suporte para corrigir o vínculo.','red');return}const {error:ue}=await supabase.from('units').insert({company_id:company.id,name:unitName,active:true});if(ue){status('setupStatus','Empresa e administrador criados, mas houve erro ao criar a unidade: '+ue.message+'. Entre novamente para continuar.','red');return}companyId=company.id;await loadUnits()});
async function loadUnits(){const {data,error}=await supabase.from('units').select('id,name,active').eq('company_id',companyId).eq('active',true).order('name');if(error){show('authView');status('authStatus','Erro ao carregar unidades: '+error.message,'red');return}units=data||[];if(!units.length){show('setupView');status('setupStatus','Sua empresa não possui unidade ativa.');return}unitId=units[0].id;renderUnitSelect();$('userLabel').textContent=session.user.email||'';show('appView');await render()}
function renderUnitSelect(){$('unitSelect').innerHTML=units.map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('');$('unitSelect').value=unitId}
$('unitSelect').addEventListener('change',async()=>{unitId=$('unitSelect').value;await render()});
$('logoutBtn').addEventListener('click',logout);$('setupLogout').addEventListener('click',logout);async function logout(){await supabase.auth.signOut();session=null;show('authView');$('authForm').reset();status('authStatus','Você saiu do GestorPro.');}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;currentPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('topTitle').textContent=titles[currentPage]||'GestorPro';render()});
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`}
async function render(){const app=$('app');app.innerHTML='<div class="notice">Carregando dados seguros da unidade...</div>';if(currentPage==='dashboard'){const {data,error}=await supabase.from('v_management_unit_dashboard').select('*').eq('unit_id',unitId).maybeSingle();if(error){app.innerHTML=`<div class="notice">Não foi possível carregar o dashboard: ${safe(error.message)}</div>`;return}const d=data||{};const kpis=[['Funcionários ativos',d.active_employees||0],['Pedidos de compra (30 dias)',d.purchase_orders_total_30d||0],['Recebimentos pendentes',d.receipts_pending_validation||0],['Inventários em andamento',d.inventories_in_progress||0],['Produtos abaixo do mínimo',d.products_below_minimum||0],['Vendas importadas (30 dias)',Number(d.sales_net_total_30d||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})],['Não conformidades abertas',d.open_nonconformities||0],['Ordens de manutenção abertas',d.open_maintenance_orders||0]];app.innerHTML=`<div class="pagehead"><div><h1>Visão geral</h1><div class="sub">Indicadores consolidados da unidade selecionada</div></div><span class="pill">Dados do Supabase</span></div><div class="grid">${kpis.map(([a,b])=>`<div class="card kpi"><small>${a}</small><b>${safe(b)}</b></div>`).join('')}</div><div class="section notice">Os indicadores começam a aparecer conforme os registros reais forem cadastrados. Nenhum dado demonstrativo foi misturado ao banco.</div>`;return}
if(currentPage==='cadastros'){const [{data:p,error:pe},{data:s,error:se}]=await Promise.all([supabase.from('products').select('id,name,unit_measure,category,minimum_stock,active').eq('company_id',companyId).order('name').limit(100),supabase.from('suppliers').select('id,name,email,phone').eq('company_id',companyId).order('name').limit(100)]);if(pe||se){app.innerHTML=`<div class="notice">Erro ao consultar cadastros: ${safe((pe||se).message)}</div>`;return}app.innerHTML=`<div class="pagehead"><div><h1>Cadastros</h1><div class="sub">Produtos e fornecedores cadastrados para a empresa</div></div></div><div class="card section"><h3>Produtos</h3>${table(['Produto','Unidade','Categoria','Estoque mínimo','Ativo'],(p||[]).map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.unit_measure)}</td><td>${safe(x.category)}</td><td>${safe(x.minimum_stock)}</td><td>${x.active?'Sim':'Não'}</td></tr>`).join(''))}</div><div class="card section"><h3>Fornecedores</h3>${table(['Fornecedor','E-mail','Telefone'],(s||[]).map(x=>`<tr><td>${safe(x.name)}</td><td>${safe(x.email)}</td><td>${safe(x.phone)}</td></tr>`).join(''))}</div>`;return}
if(currentPage==='estoque'){const {data,error}=await supabase.from('stock_balances').select('*').eq('unit_id',unitId).limit(100);app.innerHTML=error?`<div class="notice">Erro ao consultar estoque: ${safe(error.message)}</div>`:`<div class="pagehead"><div><h1>Controle de estoque</h1><div class="sub">Saldos gravados no banco por unidade</div></div></div>${table(['Registro'],(data||[]).map(x=>`<tr><td>${safe(JSON.stringify(x))}</td></tr>`).join(''))}`;return}
if(currentPage==='compras'){app.innerHTML='<div class="pagehead"><div><h1>Compras</h1><div class="sub">Pedidos e cotações serão ativados na próxima etapa de integração.</div></div></div><div class="notice">O banco já possui estrutura de compras, mas esta tela ainda não grava pedidos. Não utilize planilhas locais como registro oficial.</div>';return}
if(currentPage==='operacao'){app.innerHTML='<div class="pagehead"><div><h1>Operações</h1><div class="sub">Inventários, recebimentos, qualidade, RH e manutenção.</div></div></div><div class="notice">As tabelas e regras do backend estão preparadas; as telas operacionais serão conectadas módulo a módulo e testadas antes do uso real.</div>';return}
if(currentPage==='ajuda'){app.innerHTML='<div class="card"><h2>GestorPro conectado ao Supabase</h2><p>Login real, sessão autenticada, empresa, unidade e leitura do dashboard estão integrados nesta primeira etapa.</p><p class="notice">Ainda não é uma versão pronta para operação: cadastros, estoque, compras, recebimento e demais processos precisam de suas telas de gravação, validação e testes.</p></div>';return}}
supabase.auth.onAuthStateChange((_event,s)=>{if(!s){session=null;show('authView')} });
const {data:{session:initial}}=await supabase.auth.getSession();if(initial){session=initial;await bootstrap()}else{show('authView')}
</script>
</body></html>
