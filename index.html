color:var(--green)}.red{color:var(--red)}.tablew
rap{overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:600px}th,td{text-align:left;padding:12px 14px;border-bottom:1px solid var(--line)}th{font-size:11px;text-transform:uppercase;color:var(--muted);background:#f9fbfd}.empty{padding:28px;text-align:center;color:var(--muted)}.authwrap{min-height:100vh;display:grid;place-items:center;padding:18px}.authcard{width:min(440px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 40px #15283c12}.authbrand{font-size:24px;font-weight:850;color:var(--navy)}.authbrand small{display:block;font-size:10px;letter-spacing:2px;color:var(--muted)}.field{margin:14px 0}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}.authactions{display:flex;gap:8px;flex-wrap:wrap}.authactions button{flex:1}.hidden{display:none!important}.toolbar button{padding:9px 12px;font-size:12px}.field{min-width:0}.card h3{margin-top:0}.tablewrap select{min-width:125px;padding:8px}.status{margin-top:12px;font-size:13px;line-height:1.5}.topright{display:flex;align-items:center;gap:12px}.topright select{width:auto;max-width:230px}.topright span{color:var(--muted);font-size:12px}

<body>
<div id="authView" class="authwrap"><div class="authcard">
 <div class="authbrand">GESTORPRO<small>ERP RESTAURANTE</small></div>
 <h2 id="authTitle">Acesse sua conta</h2><p class="muted">Entre para acessar os dados seguros da sua empresa.</p>
 <form id="authForm"><div class="field"><label>E-mail</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>Senha</label><input id="password" type="password" autocomplete="current-password" minlength="6" required></div><div class="field hidden" id="nameField"><label>Nome completo</label><input id="fullName" autocomplete="name"></div><div class="authactions"><button id="loginBtn" type="submit">Entrar</button><button id="signupBtn" class="secondary" type="button">Criar conta</button></div></form>
 <div id="authStatus" class="status" role="status"></div>
 </div></div>
<div id="setupView" class="authwrap hidden"><div class="authcard"><div class="authbrand">GESTORPRO<small>CONFIGURAÇÃO INICIAL</small></div><h2>Cadastre sua empresa</h2><p class="muted">Este será o ambiente administrativo inicial da sua organização.</p><form id="setupForm"><div class="field"><label>Nome da empresa</label><input id="companyName" required maxlength="120" placeholder="Ex.: Minha Rede de Restaurantes"></div><div class="field"><label>Nome da primeira unidade</label><input id="unitName" required maxlength="120" placeholder="Ex.: Unidade Matriz"></div><button type="submit">Criar empresa e unidade</button></form><div id="setupStatus" class="status" role="status"></div><button class="secondary" id="setupLogout" type="button">Sair</button></div></div>

 <aside class="sidebar"><div class="brand">GESTORPRO<small>ERP RESTAURANTE</small></div><div class="navlabel">Gestão</div><nav class="nav" id="nav"><button class="active" data-page="dashboard">▦ &nbsp; Dashboard</button><button data-page="cadastros">♙ &nbsp; Cadastros</button><button data-page="estoque">▣ &nbsp; Estoque</button><button data-page="compras">🛒 &nbsp; Compras</button><button data-page="recebimentos">📦 &nbsp; Recebimentos</button><button data-page="rh">♙ &nbsp; Recursos Humanos</button><button data-page="operacao">☑ &nbsp; Operações</button></nav><div class="navlabel">Sistema</div><nav class="nav"><button data-page="ajuda">⚙ &nbsp; Sobre o sistema</button></nav></aside>
 <main class="main"><header class="top"><strong id="topTitle">Dashboard gerencial</strong><div class="topright"><select id="unitSelect" aria-label="Selecionar unidade"></select><span id="userLabel"></span><button class="secondary" id="logoutBtn">Sair</button></div></header><div class="content" id="app"></div></main>
</div>
<script>
window.__gestorProModuleLoaded=false;
window.__gestorProAuthHandlerReady=false;
// Impede que o formulário faça um POST/recarregamento se o módulo não inicializar.
document.addEventListener('submit',function(e){if(e.target&&e.target.id==='authForm'){e.preventDefault();if(!window.__gestorProAuthHandlerReady){var el=document.getElementById('authStatus');if(el){el.textContent='O módulo de login não foi inicializado. Verifique a conexão e atualize o index.html publicado no GitHub. Nenhum dado foi enviado.';el.className='status red';}}}},true);
window.addEventListener('error',function(e){var el=document.getElementById('authStatus');if(el&&!window.__gestorProModuleLoaded){el.textContent='O sistema não conseguiu carregar o módulo de acesso. Atualize o arquivo index.html no GitHub e tente novamente. Detalhe: '+(e.message||'erro de carregamento');el.className='status red';}});
window.addEventListener('unhandledrejection',function(e){var el=document.getElementById('authStatus');if(el){el.textContent='Falha de comunicação: '+(e.reason&&e.reason.message?e.reason.message:String(e.reason));el.className='status red';}});
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.js" onerror="document.getElementById('authStatus').textContent='Não foi possível carregar a biblioteca do Supabase. Verifique a conexão com a internet.';document.getElementById('authStatus').className='status red';"></script>
<script type="module">

  const statusEl = document.getElementById('authStatus');
  if (statusEl) {
    statusEl.textContent = 'A biblioteca do Supabase não foi carregada pelo navegador. Atualize a página ou tente outra conexão.';
    statusEl.className = 'status red';
  }
  throw new Error('Supabase UMD library unavailable');
}
const SUPABASE_URL='https://rtkohwkhbfxcqyyivlav.supabase.co';
const SUPABASE_PUBLISHABLE_KEY='sb_publishable_EfsK97hZ0JfeSGl2Lb7GcQ_wl1jy1UV';
const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
window.__gestorProModuleLoaded=true;
const $=id=>document.getElementById(id);
let session=null, memberships=[], units=[], companyId=null, unitId=null, currentPage='dashboard';
const titles={dashboard:'Dashboard gerencial',cadastros:'Cadastros',estoque:'Controle de estoque',compras:'Compras',recebimentos:'Recebimentos',rh:'Recursos Humanos',operacao:'Operações',ajuda:'Sobre o sistema'};
function status(id,msg,kind=''){const el=$(id);el.textContent=msg;el.className='status '+kind}
function show(view){['authView','setupView','appView'].forEach(id=>$(id).classList.toggle('hidden',id!==view))}
function safe(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const supplierToken=new URLSearchParams(location.search).get('supplier_quote');
if(supplierToken){document.body.innerHTML='<div class="authwrap"><div class="authcard" style="width:min(760px,100%)"><div class="authbrand">GESTORPRO<small>PORTAL DO FORNECEDOR</small></div><div id="vendorPortal"><p class="muted">Carregando cotação...</p></div></div></div>';loadSupplierPortal(supplierToken)}
async function loadSupplierPortal(token){const root=document.getElementById('vendorPortal');const {data,error}=await supabase.functions.invoke('supplier-quote-portal',{body:{action:'view',token}});if(error||data?.error){root.innerHTML='<div class="notice">'+safe(data?.error||error.message)+'</div>';return}const existing=new Map((data.existing||[]).map(x=>[x.quote_item_id,x]));root.innerHTML='<h2>'+safe(data.title)+'</h2><p>Fornecedor: <b>'+safe(data.supplier)+'</b></p><p class="muted">Prazo final: '+new Date(data.deadline).toLocaleString('pt-BR')+'</p><form id="vendorQuoteForm">'+(data.items||[]).map(it=>{const old=existing.get(it.id)||{};return '<div class="card field"><b>'+safe(it.products?.name)+'</b><div class="muted">Quantidade solicitada: '+safe(it.quantity)+' '+safe(it.products?.unit_measure||'')+'</div><div class="field"><label>Preço unitário (R$)</label><input required type="number" min="0.0001" step="0.0001" name="price_'+it.id+'" value="'+safe(old.unit_price||'')+'"></div><div class="field"><label>Marca / fabricante</label><input name="brand_'+it.id+'" value="'+safe(old.brand||'')+'"></div><div class="field"><label>Observações</label><input name="notes_'+it.id+'" value="'+safe(old.notes||'')+'"></div></div>'}).join('')+'<button type="submit">Enviar proposta</button><div id="vendorStatus" class="status"></div></form>';document.getElementById('vendorQuoteForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const prices=(data.items||[]).map(it=>({quote_item_id:it.id,unit_price:Number(f.get('price_'+it.id)),brand:f.get('brand_'+it.id),notes:f.get('notes_'+it.id)}));const btn=e.currentTarget.querySelector('button[type=submit]');btn.disabled=true;const out=await supabase.functions.invoke('supplier-quote-portal',{body:{action:'submit',token,prices}});const st=document.getElementById('vendorStatus');if(out.error||out.data?.error){st.textContent=out.data?.error||out.error.message;st.className='status red';btn.disabled=false;return}root.innerHTML='<div class="notice green">'+safe(out.data.message)+'</div>'}}

if(!supplierToken){
$('authForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('loginBtn');btn.disabled=true;status('authStatus','Conectando ao servidor...');try{const email=$('email').value.trim(),password=$('password').value;if(!email||!password){status('authStatus','Informe e-mail e senha.','red');return}const {data,error}=await supabase.auth.signInWithPassword({email,password});if(error){status('authStatus','Não foi possível entrar: '+error.message,'red');return}if(!data?.session){status('authStatus','O servidor não retornou uma sessão. Verifique a confirmação do e-mail.','red');return}session=data.session;status('authStatus','Login confirmado. Carregando seus dados...');await bootstrap()}catch(err){status('authStatus','Falha inesperada no login: '+(err?.message||String(err)),'red')}finally{btn.disabled=false}});
window.__gestorProAuthHandlerReady=true;
$('signupBtn').addEventListener('click',async()=>{const name=$('fullName').value.trim();if(!name){$('nameField').classList.remove('hidden');$('fullName').required=true;status('authStatus','Informe seu nome completo e toque em Criar conta novamente.');return}status('authStatus','Criando conta...');const {data,error}=await supabase.auth.signUp({email:$('email').value.trim(),password:$('password').value,options:{data:{full_name:name}}});if(error){status('authStatus',error.message,'red');return}if(data.session){session=data.session;await bootstrap()}else{status('authStatus','Conta criada. Confirme o e-mail pelo link enviado e depois volte para entrar.','green')}});
async function bootstrap(){const {data:{session:s}}=await supabase.auth.getSession();session=s;if(!session){show('authView');return}const {data:mem,error}=await supabase.from('company_memberships').select('company_id,role,companies(id,name)').eq('user_id',session.user.id);if(error){show('authView');status('authStatus','Não foi possível carregar seu acesso: '+error.message,'red');return}memberships=mem||[];if(!memberships.length){show('setupView');return}companyId=memberships[0].company_id;await loadUnits()}
$('setupForm').addEventListener('submit',async e=>{e.preventDefault();if(!session){show('authView');return}status('setupStatus','Criando empresa...');const name=$('companyName').value.trim(),unitName=$('unitName').value.trim();const {data:company,error:ce}=await supabase.from('companies').insert({name,owner_id:session.user.id}).select('id,name').single();if(ce){status('setupStatus','Erro ao criar empresa: '+ce.message,'red');return}const {error:me}=await supabase.from('company_memberships').insert({company_id:company.id,user_id:session.user.id,role:'admin'});if(me){status('setupStatus','Empresa criada, mas não foi possível criar seu vínculo de administrador: '+me.message+'. Não tente criar outra empresa; peça suporte para corrigir o vínculo.','red');return}const {error:ue}=await supabase.from('units').insert({company_id:company.id,name:unitName,active:true});if(ue){status('setupStatus','Empresa e administrador criados, mas houve erro ao criar a unidade: '+ue.message+'. Entre novamente para continuar.','red');return}companyId=company.id;await loadUnits()});
async function loadUnits(){const {data,error}=await supabase.from('units').select('id,name,active').eq('company_id',companyId).eq('active',true).order('name');if(error){show('authView');status('authStatus','Erro ao carregar unidades: '+error.message,'red');return}units=data||[];if(!units.length){show('setupView');status('setupStatus','Sua empresa não possui unidade ativa.');return}unitId=units[0].id;renderUnitSelect();$('userLabel').textContent=session.user.email||'';show('appView');await render()}
function renderUnitSelect(){$('unitSelect').innerHTML=units.map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('');$('unitSelect').value=unitId}
$('unitSelect').addEventListener('change',async()=>{unitId=$('unitSelect').value;await render()});
$('logoutBtn').addEventListener('click',logout);$('setupLogout').addEventListener('click',logout);async function logout(){await supabase.auth.signOut();session=null;show('authView');$('authForm').reset();status('authStatus','Você saiu do GestorPro.');}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;currentPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('topTitle').textContent=titles[currentPage]||'GestorPro';render()});
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`}
async function render(){const app=$('app');app.innerHTML='<div class="notice">Carregando dados seguros da unidade...</div>';if(currentPage==='dashboard'){const {data,error}=await supabase.from('v_management_unit_dashboard').select('*').eq('unit_id',unitId).maybeSingle();if(error){app.innerHTML=`<div class="notice">Não foi possível carregar o dashboard: ${safe(error.message)}</div>`;return}const d=data||{};const kpis=[['Funcionários ativos',d.active_employees||0],['Pedidos de compra (30 dias)',d.purchase_orders_total_30d||0],['Recebimentos pendentes',d.receipts_pending_validation||0],['Inventários em andamento',d.inventories_in_progress||0],['Produtos abaixo do mínimo',d.products_below_minimum||0],['Vendas importadas (30 dias)',Number(d.sales_net_total_30d||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})],['Não conformidades abertas',d.open_nonconformities||0],['Ordens de manutenção abertas',d.open_maintenance_orders||0]];app.innerHTML=`<div class="pagehead"><div><h1>Visão geral</h1><div class="sub">Indicadores consolidados da unidade selecionada</div></div><span class="pill">Dados do Supabase</span></div><div class="grid">${kpis.map(([a,b])=>`<div class="card kpi"><small>${a}</small><b>${safe(b)}</b></div>`).join('')}</div><div class="section notice">Os indicadores começam a aparecer conforme os registros reais forem cadastrados. Nenhum dado demonstrativo foi misturado ao banco.</div>`;return}
if(currentPage==='cadastros'){
const tabs=[['products','Produtos'],['suppliers','Fornecedores'],['employees','Funcionários'],['users','Usuários'],['external_users','Usuários externos'],['structures','Estruturas'],['agreements','Convênios'],['services','Serviços']];
let tab=window.gpCadTab||'products';
const configs={
 products:{table:'products',title:'Produtos',fields:[['name','Nome do produto','text',true],['category','Categoria','text',false],['unit_measure','Unidade de medida','select',true,['UN','KG','G','L','ML','CX','PCT','FD']],['minimum_stock','Estoque mínimo','number',false]],cols:[['name','Produto'],['unit_measure','Unidade'],['category','Categoria'],['minimum_stock','Estoque mínimo']]},
 suppliers:{table:'suppliers',title:'Fornecedores',fields:[['name','Razão social / nome','text',true],['document','CNPJ / CPF','text',false],['contact_name','Contato','text',false],['email','E-mail','email',false],['phone','Telefone','text',false]],cols:[['name','Fornecedor'],['document','Documento'],['contact_name','Contato'],['email','E-mail'],['phone','Telefone']]},
 employees:{table:'employees',title:'Funcionários',fields:[['full_name','Nome completo','text',true],['employee_code','Matrícula / código (opcional)','text',false],['email','E-mail','email',false],['phone','Telefone','text',false],['position_id','Cargo','select',false],['hire_date','Data de admissão','date',false],['employment_status','Situação','select',true,['active','inactive','on_leave']]],cols:[['employee_code','Matrícula'],['full_name','Funcionário'],['email','E-mail'],['employment_status','Situação']]},
 external_users:{table:'external_users',title:'Usuários externos',fields:[['name','Nome / empresa','text',true],['organization','Organização','text',false],['email','E-mail','email',false],['phone','Telefone','text',false],['access_type','Tipo de acesso / vínculo','text',false],['notes','Observações','text',false]],cols:[['name','Nome'],['organization','Organização'],['email','E-mail'],['access_type','Vínculo']]},
 structures:{table:'job_positions',title:'Estruturas e cargos',fields:[['title','Cargo / função','text',true],['department','Setor / departamento','text',false],['description','Descrição','text',false]],cols:[['title','Cargo / função'],['department','Setor'],['description','Descrição']]},
 agreements:{table:'company_agreements',title:'Convênios',fields:[['name','Nome do convênio','text',true],['partner_name','Empresa parceira','text',false],['agreement_code','Código','text',false],['start_date','Início','date',false],['end_date','Fim','date',false],['notes','Observações','text',false]],cols:[['name','Convênio'],['partner_name','Parceiro'],['agreement_code','Código'],['start_date','Início'],['end_date','Fim']]},
 services:{table:'company_services',title:'Serviços',fields:[['name','Nome do serviço','text',true],['category','Categoria','text',false],['description','Descrição','text',false]],cols:[['name','Serviço'],['category','Categoria'],['description','Descrição']]}
};
const [positionsRes]=await Promise.all([supabase.from('job_positions').select('id,title,department,active').eq('company_id',companyId).eq('active',true).order('title')]);
const positions=positionsRes.data||[];
let rows=[],error=null,users=[];
if(tab==='users'){
 const {data:m,error:me}=await supabase.from('company_memberships').select('id,user_id,role,created_at').eq('company_id',companyId).order('created_at');error=me;
 if(!error&&m?.length){const {data:pr,error:pe}=await supabase.from('user_profiles').select('id,full_name,email').in('id',m.map(x=>x.user_id));error=pe;users=(m||[]).map(x=>({...x,profile:(pr||[]).find(y=>y.id===x.user_id)}));}
}else{
 const c=configs[tab];const {data,error:e}=await supabase.from(c.table).select('*').eq('company_id',companyId).order('created_at',{ascending:false}).limit(300);rows=data||[];error=e;
}
if(error){app.innerHTML=`<div class="notice">Erro ao carregar ${safe(tabs.find(x=>x[0]===tab)?.[1]||'cadastros')}: ${safe(error.message)}</div>`;return}
const activeCount=tab==='users'?users.length:rows.filter(x=>x.active!==false&&x.employment_status==='active').length;
const makeInput=(field,value='')=>{const [key,label,type,required,opts]=field;let v=value??'';if(key==='position_id'){return `<div class="field"><label>${label}</label><select name="${key}"><option value="">Não informado</option>${positions.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${safe(p.title)}${p.department?' — '+safe(p.department):''}</option>`).join('')}</select></div>`}if(type==='select'){const options=key==='unit_measure'?opts.map(x=>[x,x]):key==='employment_status'?[['active','Ativo'],['on_leave','Afastado'],['terminated','Desligado']]:opts.map(x=>[x,x]);return `<div class="field"><label>${label}${required?' *':''}</label><select name="${key}" ${required?'required':''}>${options.map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('')}</select></div>`}return `<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${type}" value="${safe(v)}" ${required?'required':''} ${type==='number'?'min="0" step="0.001"':''}></div>`};
const formFields=(cfg,item={})=>cfg.fields.map(f=>makeInput(f,item[f[0]])).join('');
const display=(v)=>v===null||v===undefined||v===''?'—':safe(v);

async function renderStock(app){

 let body='';
 if(tab==='balances'){
  const {data,error}=await supabase.from('stock_balances').select('product_id,quantity,average_cost,products(name,unit_measure,minimum_stock)').eq('unit_id',unitId).limit(500);
  if(error){app.innerHTML=header+`<div class="notice">Erro ao consultar saldos: ${safe(error.message)}</div>`;return}
  const rows=(data||[]).map(x=>{const low=Number(x.quantity)<=Number(x.products?.minimum_stock||0);return `<tr><td>${safe(x.products?.name)}</td><td>${fmt(x.quantity)} ${safe(x.products?.unit_measure)}</td><td>${Number(x.average_cost||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td><td>${fmt(x.products?.minimum_stock)}</td><td>${low?'<span class="pill" style="background:#fff4df;color:#98620d">Abaixo do mínimo</span>':'<span class="pill green">Normal</span>'}</td></tr>`}).join('');
  body=`<div class="card"><h3>Posição atual do estoque</h3>${table(['Produto','Saldo atual','Custo médio','Estoque mínimo','Situação'],rows)}<p class="muted">O saldo é atualizado exclusivamente pelas rotinas seguras de movimentação, perdas e finalização de inventário.</p></div><div class="card section"><h3>Registrar movimentação</h3><form id="movementForm"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Produto *</label><select name="product_id" required>${opts}</select></div><div class="field"><label>Tipo *</label><select name="movement_type"><option value="entry">Entrada</option><option value="exit">Saída</option><option value="adjustment">Ajuste</option></select></div><div class="field"><label>Quantidade *</label><input name="quantity" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Custo unitário (R$)</label><input name="unit_cost" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Direção do ajuste</label><select name="direction"><option value="">Não se aplica</option><option value="increase">Aumentar</option><option value="decrease">Diminuir</option></select></div><div class="field"><label>Justificativa (obrigatória se autorizar saldo negativo)</label><input name="negative_justification" maxlength="500"></div></div><div class="field"><label>Observações *</label><input name="notes" required maxlength="500" placeholder="Informe o motivo da movimentação"></div><button type="submit">Registrar movimentação</button><div id="movementStatus" class="status"></div></form></div>`;
 }else if(tab==='movements'){
  const {data,error}=await supabase.from('stock_movements').select('id,movement_type,quantity,unit_cost,quantity_before,quantity_after,notes,created_at,products(name,unit_measure)').eq('unit_id',unitId).order('created_at',{ascending:false}).limit(200);
  if(error){body=`<div class="notice">Erro ao consultar movimentações: ${safe(error.message)}</div>`}else{const rows=(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td><td>${safe(x.products?.name)}</td><td>${({entry:'Entrada',exit:'Saída',adjustment:'Ajuste',loss:'Perda',inventory:'Inventário'}[x.movement_type]||safe(x.movement_type))}</td><td>${fmt(x.quantity)} ${safe(x.products?.unit_measure)}</td><td>${fmt(x.quantity_before)} → ${fmt(x.quantity_after)}</td><td>${safe(x.notes)}</td></tr>`).join('');body=`<div class="card"><h3>Histórico de movimentações</h3>${table(['Data','Produto','Tipo','Quantidade','Saldo antes → depois','Observações'],rows)}</div>`}
 }else if(tab==='losses'){
  const {data,error}=await supabase.from('stock_losses').select('id,quantity,unit_cost,reason,notes,created_at,products(name,unit_measure)').eq('unit_id',unitId).order('created_at',{ascending:false}).limit(200);
  const rows=(data||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td><td>${safe(x.products?.name)}</td><td>${fmt(x.quantity)} ${safe(x.products?.unit_measure)}</td><td>${safe(x.reason)}</td><td>${safe(x.notes)}</td><td>${(Number(x.quantity)*Number(x.unit_cost)).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</td></tr>`).join('');
  body=`${error?`<div class="notice">Erro ao consultar perdas: ${safe(error.message)}</div>`:''}<div class="card"><h3>Registrar avaria ou perda</h3><form id="lossForm"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Produto *</label><select name="product_id" required>${opts}</select></div><div class="field"><label>Quantidade perdida *</label><input name="quantity" type="number" min="0.001" step="0.001" required></div><div class="field"><label>Motivo *</label><select name="reason" required><option value="Vencimento">Vencimento</option><option value="Avaria">Avaria</option><option value="Descarte de produção">Descarte de produção</option><option value="Contaminação">Contaminação</option><option value="Quebra">Quebra</option><option value="Outro">Outro</option></select></div><div class="field"><label>Justificativa se precisar autorizar saldo negativo</label><input name="negative_justification" maxlength="500"></div></div><div class="field"><label>Detalhes</label><input name="notes" maxlength="500"></div><button type="submit">Registrar perda</button><div id="lossStatus" class="status"></div></form></div><div class="card section"><h3>Histórico de perdas</h3>${table(['Data','Produto','Quantidade','Motivo','Detalhes','Valor estimado'],rows)}</div>`;
 }else if(tab==='inventory'){
  const {data:counts,error}=await supabase.from('inventory_counts').select('id,count_date,status,created_at').eq('unit_id',unitId).order('created_at',{ascending:false}).limit(100);
  const statusLabel={in_progress:'Em andamento',pending_approval:'Aguardando aprovação',finalized:'Finalizado',cancelled:'Cancelado'};
  const rows=(counts||[]).map(x=>`<tr><td>${safe(x.count_date)}</td><td>${statusLabel[x.status]||safe(x.status)}</td><td><button class="secondary" data-inv-open="${x.id}">Abrir contagem</button></td></tr>`).join('');
  body=`${error?`<div class="notice">Erro ao consultar inventários: ${safe(error.message)}</div>`:''}<div class="card"><h3>Novo inventário físico</h3><p class="muted">Abra uma contagem para registrar quantidades físicas por produto. O sistema captura o saldo teórico no momento em que cada item é incluído.</p><form id="inventoryCreate"><div class="field"><label>Data da contagem</label><input name="count_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><button type="submit">Iniciar inventário</button><div id="inventoryStatus" class="status"></div></form></div><div class="card section"><h3>Inventários da unidade</h3>${table(['Data','Situação','Ação'],rows)}</div><div id="inventoryDetail" class="section"></div>`;
 }else if(tab==='expiry'){
  const {data:lots,error}=await supabase.from('product_expiry_lots').select('id,lot_code,supplier_lot_code,received_date,expiry_date,initial_quantity,remaining_quantity,status,products(name,unit_measure)').eq('unit_id',unitId).order('expiry_date').limit(200);
  const rows=(lots||[]).map(x=>`<tr><td>${safe(x.products?.name)}</td><td>${safe(x.lot_code)}</td><td>${safe(x.supplier_lot_code)}</td><td>${safe(x.received_date)}</td><td>${safe(x.expiry_date)}</td><td>${fmt(x.remaining_quantity)} ${safe(x.products?.unit_measure)}</td><td>${safe(x.status)}</td></tr>`).join('');
  body=`${error?`<div class="notice">Erro ao consultar lotes: ${safe(error.message)}</div>`:''}<div class="card"><h3>Cadastrar lote e validade</h3><form id="lotForm"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Produto *</label><select name="product_id" required>${opts}</select></div><div class="field"><label>Código interno do lote *</label><input name="lot_code" required></div><div class="field"><label>Lote do fornecedor</label><input name="supplier_lot_code"></div><div class="field"><label>Data de recebimento *</label><input name="received_date" type="date" value="${new Date().toISOString().slice(0,10)}" required></div><div class="field"><label>Validade *</label><input name="expiry_date" type="date" required></div><div class="field"><label>Quantidade inicial *</label><input name="initial_quantity" type="number" min="0.001" step="0.001" required></div></div><button type="submit">Salvar lote</button><div id="lotStatus" class="status"></div></form></div><div class="card section"><h3>Lotes cadastrados</h3>${table(['Produto','Lote','Lote fornecedor','Recebido','Validade','Saldo lote','Status'],rows)}</div>`;
 }else if(tab==='transfers'){
  const destinations=units.filter(u=>u.id!==unitId).map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('');
  const {data:transfers,error}=await supabase.from('stock_transfers').select('id,quantity,unit_cost,notes,created_at,source_unit_id,destination_unit_id,products(name),source:units!stock_transfers_source_unit_id_fkey(name),destination:units!stock_transfers_destination_unit_id_fkey(name)').or(`source_unit_id.eq.${unitId},destination_unit_id.eq.${unitId}`).order('created_at',{ascending:false}).limit(100);
  const transferRows=(transfers||[]).map(x=>`<tr><td>${new Date(x.created_at).toLocaleString('pt-BR')}</td><td>${safe(x.products?.name)}</td><td>${safe(x.source?.name)}</td><td>${safe(x.destination?.name)}</td><td>${fmt(x.quantity)}</td><td>${safe(x.notes)}</td></tr>`).join('');
  body=`${error?`<div class="notice">Erro ao consultar transferências: ${safe(error.message)}</div>`:''}<div class="card"><h3>Transferir entre unidades</h3>${destinations?`<form id="transferForm"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="field"><label>Produto *</label><select name="product_id" required>${opts}</select></div><div class="field"><label>Unidade de destino *</label><select name="destination_unit_id" required>${destinations}</select></div><div class="field"><label>Quantidade *</label><input name="quantity" type="number" min="0.001" step="0.001" required></div></div><div class="field"><label>Observações</label><input name="notes" maxlength="500"></div><button type="submit">Confirmar transferência</button><div id="transferStatus" class="status"></div></form>`:'<div class="notice">Nenhuma outra unidade está disponível para transferência. O administrador precisa ter acesso às unidades de origem e destino.</div>'}</div><div class="card section"><h3>Histórico de transferências</h3>${table(['Data','Produto','Origem','Destino','Quantidade','Observações'],transferRows)}</div>`;

 app.innerHTML=header+body;
 app.querySelectorAll('[data-stock-tab]').forEach(b=>b.addEventListener('click',()=>{window.gpStockTab=b.dataset.stockTab;render()}));
 if(tab==='balances'){

 }

 if(tab==='transfers'&&$('transferForm'))$('transferForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await supabase.rpc('transfer_stock_between_units',{p_company_id:companyId,p_source_unit_id:unitId,p_destination_unit_id:String(f.get('destination_unit_id')),p_product_id:String(f.get('product_id')),p_quantity:Number(f.get('quantity')),p_notes:String(f.get('notes')||'').trim()||null,p_idempotency_key:crypto.randomUUID()});if(error){msg('transferStatus','Não foi possível transferir: '+error.message,true);return}msg('transferStatus','Transferência concluída nas duas unidades.');await renderStock(app)});
 if(tab==='inventory'){

  app.querySelectorAll('[data-inv-open]').forEach(b=>b.addEventListener('click',()=>openInventory(b.dataset.invOpen)));
 }

async function openInventory(inventoryId){
 const host=$('inventoryDetail');if(!host)return;host.innerHTML='<div class="notice">Carregando itens do inventário...</div>';

 host.innerHTML=`<div class="card"><div style="display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap"><div><h3>Inventário de ${safe(head.count_date)}</h3><span class="pill">${({in_progress:'Em andamento',pending_approval:'Aguardando aprovação',finalized:'Finalizado',cancelled:'Cancelado'}[head.status]||head.status)}</span></div><button type="button" class="secondary" id="closeInvDetail">Fechar detalhes</button></div>${addForm}<div class="section">${table(['Produto','Saldo do sistema','Contagem física','Diferença'],rows)}</div>${editable?`<div class="authactions"><button type="button" id="saveInvItems">Salvar contagens</button><button type="button" id="submitInv">Enviar para aprovação</button></div>`:''}${head.status==='pending_approval'?'<button type="button" id="finalizeInv">Aprovar e finalizar inventário</button>':''}<div id="invDetailStatus" class="status"></div></div>`;
 $('closeInvDetail').addEventListener('click',()=>host.innerHTML='');
 if(editable){$('inventoryItemForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await supabase.from('inventory_count_items').insert({count_id:inventoryId,product_id:String(f.get('product_id')),counted_quantity:0});const el=$('invDetailStatus');el.textContent=error?'Erro ao adicionar produto: '+error.message:'Produto adicionado à contagem.';el.className='status '+(error?'red':'green');if(!error)await openInventory(inventoryId)});
 $('saveInvItems').addEventListener('click',async()=>{for(const input of host.querySelectorAll('.inv-qty')){const {error}=await supabase.from('inventory_count_items').update({counted_quantity:Number(input.value)}).eq('id',input.dataset.item);if(error){$('invDetailStatus').textContent='Erro ao salvar contagem: '+error.message;$('invDetailStatus').className='status red';return}}$('invDetailStatus').textContent='Contagens salvas.';$('invDetailStatus').className='status green';await openInventory(inventoryId)});
 $('submitInv').addEventListener('click',async()=>{const {error}=await supabase.rpc('submit_inventory_for_approval',{p_inventory_id:inventoryId});if(error){$('invDetailStatus').textContent='Erro ao enviar: '+error.message;$('invDetailStatus').className='status red';return}await renderStock($('app'))});
 }
 if(head.status==='pending_approval')$('finalizeInv').addEventListener('click',async()=>{if(!confirm('Confirma a aprovação e finalização? O saldo será ajustado conforme a contagem física.'))return;const {error}=await supabase.rpc('finalize_inventory',{p_inventory_id:inventoryId});if(error){$('invDetailStatus').textContent='Erro ao finalizar: '+error.message;$('invDetailStatus').className='status red';return}await renderStock($('app'))});
}

 app.querySelectorAll('[data-purchase-tab]').forEach(b=>b.addEventListener('click',()=>{window.gpPurchaseTab=b.dataset.purchaseTab;renderPurchases(app)}));

  $('addQuoteItem').addEventListener('click',addItem);addItem();
  $('quoteForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget),supplierIds=f.getAll('supplier_ids');if(!supplierIds.length){msg('quoteStatus','Selecione ao menos um fornecedor.',true);return}const itemEls=[...$('quoteItems').children];if(!itemEls.length){msg('quoteStatus','Adicione ao menos um produto.',true);return}const opening=new Date(String(f.get('opened_at'))),closing=new Date(String(f.get('deadline')));if(!(opening<closing)){msg('quoteStatus','O encerramento deve ser posterior à abertura.',true);return}if(closing<=new Date()){msg('quoteStatus','O encerramento deve estar no futuro.',true);return}const {data:q,error}=await supabase.from('purchase_quotes').insert({company_id:companyId,unit_id:unitId,title:String(f.get('title')).trim(),opened_at:new Date(String(f.get('opened_at'))).toISOString(),deadline:new Date(String(f.get('deadline'))).toISOString(),created_by:session.user.id}).select('id').single();if(error){msg('quoteStatus','Erro ao criar cotação: '+error.message,true);return}const items=itemEls.map(el=>{const fields=el.querySelectorAll('select,input');return {quote_id:q.id,product_id:fields[0].value,quantity:Number(fields[1].value),estimated_price:0}});const {data:createdItems,error:ie}=await supabase.from('purchase_quote_items').insert(items).select('id');if(ie){msg('quoteStatus','Cotação criada, mas houve erro ao salvar itens: '+ie.message,true);return}const links=supplierIds.map(supplier_id=>({quote_id:q.id,supplier_id,token_hash:crypto.randomUUID()}));const {error:le}=await supabase.from('supplier_quote_links').insert(links);if(le){msg('quoteStatus','Itens criados, mas houve erro ao vincular fornecedores: '+le.message,true);return}window.gpActiveQuote=q.id;await renderPurchases(app);await openQuoteDetail(q.id)});

 if(tab==='history')app.querySelectorAll('[data-open-quote]').forEach(b=>b.addEventListener('click',()=>openQuoteDetail(b.dataset.openQuote)));
 if(window.gpActiveQuote&&tab==='quotes')await openQuoteDetail(window.gpActiveQuote);
 async function openQuoteDetail(id){const host=$('quoteDetail');if(!host)return;host.innerHTML='<div class="notice">Carregando comparação de preços...</div>';
  const [{data:q},{data:items,error:ie},{data:links}]=await Promise.all([supabase.from('purchase_quotes').select('id,title,status').eq('id',id).single(),supabase.from('purchase_quote_items').select('id,product_id,quantity,winner_supplier_id,products(name,unit_measure)').eq('quote_id',id),supabase.from('supplier_quote_links').select('id,supplier_id,supplier_email,sent_at,submitted_at,suppliers(name,email)').eq('quote_id',id)]);

  $('sendSupplierInvites').onclick=async()=>{const b=$('sendSupplierInvites');b.disabled=true;msg('quoteDetailStatus','Enviando convites...');const {data,error}=await supabase.functions.invoke('supplier-quote-portal',{body:{action:'send',quote_id:id}});if(error||data?.error){msg('quoteDetailStatus',data?.error||error.message,true);b.disabled=false;return}const failed=(data.results||[]).filter(x=>!x.sent);msg('quoteDetailStatus',data.sent+' de '+data.total+' convite(s) enviado(s). '+failed.map(x=>x.supplier+': '+x.error).join(' | '),failed.length>0);await openQuoteDetail(id)};

 }

async function renderGoodsReceipts(app){
 const money=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
 const statusLabel={in_progress:'Em andamento',pending_validation:'Aguardando validação',finalized:'Finalizado',cancelled:'Cancelado'};

  supabase.from('goods_receipts').select('id,order_id,status,received_at,notes,validated_at,purchase_orders(order_number,suppliers(name))').eq('unit_id',unitId).order('received_at',{ascending:false}).limit(100)
 ]);
 if(oe||re){app.innerHTML='<div class="notice">Erro ao carregar recebimentos: '+safe((oe||re).message)+'</div>';return}
 const orderOpts=(orders||[]).map(o=>'<option value="'+o.id+'">Pedido #'+safe(o.order_number)+' — '+safe(o.suppliers?.name||'Fornecedor')+' — '+money(o.total_amount)+'</option>').join('');
 const rows=(receipts||[]).map(r=>'<tr><td>#'+safe(r.purchase_orders?.order_number||'—')+'</td><td>'+safe(r.purchase_orders?.suppliers?.name||'Fornecedor')+'</td><td>'+safe(statusLabel[r.status]||r.status)+'</td><td>'+new Date(r.received_at).toLocaleString('pt-BR')+'</td><td>'+(r.validated_at?'Validado':'—')+'</td><td><button class="secondary" data-receipt-open="'+r.id+'">Abrir</button></td></tr>').join('');
 app.innerHTML='<div class="pagehead"><div><h1>Recebimento de mercadorias</h1><div class="sub">Conferência de entregas vinculada aos pedidos aprovados — '+safe(units.find(u=>u.id===unitId)?.name||'unidade')+'</div></div></div>'+
 '<div class="grid section" style="grid-template-columns:repeat(2,minmax(0,1fr))"><div class="card"><h3>Iniciar recebimento</h3>'+(orderOpts?'<form id="receiptStartForm"><div class="field"><label>Pedido aprovado</label><select name="order_id" required>'+orderOpts+'</select></div><div class="field"><label>Observações / nota fiscal</label><textarea name="notes" rows="3" placeholder="Número da nota fiscal, transportadora ou observações"></textarea></div><button type="submit">Iniciar conferência</button><div id="receiptStartStatus" class="status"></div></form>':'<div class="notice">Não há pedidos aprovados aguardando recebimento nesta unidade.</div>')+'</div><div class="card"><h3>Como funciona</h3><p>O funcionário registra as quantidades efetivamente entregues e informa justificativas para faltas ou excessos.</p><p class="notice">O envio para validação não altera o estoque. A validação é restrita a gerente ou administrador. A integração da finalização com a entrada definitiva no estoque será concluída na próxima etapa.</p></div></div>'+
 '<div class="card section"><h3>Recebimentos da unidade</h3>'+table(['Pedido','Fornecedor','Status','Data','Validação','Ação'],rows)+'</div><div id="receiptDetail" class="section"></div>';
 const start=$('receiptStartForm');

  if(ie||!items?.length){$('receiptStartStatus').textContent='Pedido sem itens ou erro ao consultar itens.';$('receiptStartStatus').className='status red';return}

  if(ce||!receipt){$('receiptStartStatus').textContent='Erro ao iniciar recebimento: '+(ce?.message||'sem retorno');$('receiptStartStatus').className='status red';return}
  const payload=items.map(it=>({receipt_id:receipt.id,order_item_id:it.id,ordered_quantity:it.quantity,received_quantity:0}));

  if(ii){$('receiptStartStatus').textContent='Recebimento criado, mas houve erro ao criar os itens: '+ii.message;$('receiptStartStatus').className='status red';return}

 });
 app.querySelectorAll('[data-receipt-open]').forEach(b=>b.addEventListener('click',()=>openReceipt(b.dataset.receiptOpen)));
 async function openReceipt(id){
  const host=$('receiptDetail');if(!host)return;host.innerHTML='<div class="notice">Carregando conferência...</div>';
  const [{data:r,error:er},{data:items,error:ei}]=await Promise.all([
   supabase.from('goods_receipts').select('id,status,notes,received_at,validated_at,order_id,purchase_orders(order_number,suppliers(name))').eq('id',id).eq('unit_id',unitId).single(),
   supabase.from('goods_receipt_items').select('id,order_item_id,ordered_quantity,received_quantity,discrepancy_reason,purchase_order_items(product_id,unit_price,products(name,unit_measure))').eq('receipt_id',id)
  ]);
  if(er||ei||!r){host.innerHTML='<div class="notice">Erro ao abrir recebimento: '+safe((er||ei)?.message||'registro não encontrado')+'</div>';return}

  form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form),raw={};for(const [k,v] of fd.entries())raw[k]=String(v).trim();
   let payload;try{payload=build(raw)}catch(err){$('hrStatus').textContent=err.message;$('hrStatus').className='status red';return}
   const {error}=await supabase.from(tableName).insert(payload);if(error){$('hrStatus').textContent='Não foi possível salvar: '+error.message;$('hrStatus').className='status red';return}
   $('hrStatus').textContent='Registro salvo com sucesso.';$('hrStatus').className='status green';form.reset();await render();
  });
 }
}

if(currentPage==='operacao'){app.innerHTML='<div class="pagehead"><div><h1>Operações</h1><div class="sub">Inventários, recebimentos, qualidade, RH e manutenção.</div></div></div><div class="notice">As tabelas e regras do backend estão preparadas; as telas operacionais serão conectadas módulo a módulo e testadas antes do uso real.</div>';return}
if(currentPage==='ajuda'){app.innerHTML='<div class="card"><h2>GestorPro conectado ao Supabase</h2><p>Login real, sessão autenticada, empresa, unidade e leitura do dashboard estão integrados nesta primeira etapa.</p><p class="notice">Ainda não é uma versão pronta para operação: cadastros, estoque, compras, recebimento e demais processos precisam de suas telas de gravação, validação e testes.</p></div>';return}}
supabase.auth.onAuthStateChange((_event,s)=>{if(!s){session=null;show('authView')} });
const {data:{session:initial}}=await supabase.auth.getSession();if(initial){session=initial;await bootstrap()}else{show('authView')}

}
