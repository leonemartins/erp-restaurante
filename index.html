 <div class="authbrand">GESTORPRO<small>ERP RESTAURANTE</small></div>

<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2.49.1';
const SUPABASE_URL='https://rtkohwkhbfxcqyyivlav.supabase.co';

const supabase=createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);

$('setupForm').addEventListener('submit',async e=>{e.preventDefault();if(!session){show('authView');return}status('setupStatus','Criando empresa...');const name=$('companyName').value.trim(),unitName=$('unitName').value.trim();const {data:company,error:ce}=await supabase.from('companies').insert({name,owner_id:session.user.id}).select('id,name').single();if(ce){status('setupStatus','Erro ao criar empresa: '+ce.message,'red');return}const {error:me}=await supabase.from('company_memberships').insert({company_id:company.id,user_id:session.user.id,role:'admin'});if(me){status('setupStatus','Empresa criada, mas não foi possível criar seu vínculo de administrador: '+me.message+'. Não tente criar outra empresa; peça suporte para corrigir o vínculo.','red');return}const {error:ue}=await supabase.from('units').insert({company_id:company.id,name:unitName,active:true});if(ue){status('setupStatus','Empresa e administrador criados, mas houve erro ao criar a unidade: '+ue.message+'. Entre novamente para continuar.','red');return}companyId=company.id;await loadUnits()});
async function loadUnits(){const {data,error}=await supabase.from('units').select('id,name,active').eq('company_id',companyId).eq('active',true).order('name');if(error){show('authView');status('authStatus','Erro ao carregar unidades: '+error.message,'red');return}units=data||[];if(!units.length){show('setupView');status('setupStatus','Sua empresa não possui unidade ativa.');return}unitId=units[0].id;renderUnitSelect();$('userLabel').textContent=session.user.email||'';show('appView');await render()}
function renderUnitSelect(){$('unitSelect').innerHTML=units.map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('');$('unitSelect').value=unitId}

$('logoutBtn').addEventListener('click',logout);$('setupLogout').addEventListener('click',logout);async function logout(){await supabase.auth.signOut();session=null;show('authView');$('authForm').reset();status('authStatus','Você saiu do GestorPro.');}
$('nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(!b)return;currentPage=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('active',x===b));$('topTitle').textContent=titles[currentPage]||'GestorPro';render()});
function table(headers,rows){return `<div class="tablewrap"><table><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows||''}</tbody></table>${rows?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`}
async function render(){const app=$('app');app.innerHTML='<div class="notice">Carregando dados seguros da unidade...</div>';if(currentPage==='dashboard'){const {data,error}=await supabase.from('v_management_unit_dashboard').select('*').eq('unit_id',unitId).maybeSingle();if(error){app.innerHTML=`<div class="notice">Não foi possível carregar o dashboard: ${safe(error.message)}</div>`;return}const d=data||{};const kpis=[['Funcionários ativos',d.active_employees||0],['Pedidos de compra (30 dias)',d.purchase_orders_total_30d||0],['Recebimentos pendentes',d.receipts_pending_validation||0],['Inventários em andamento',d.inventories_in_progress||0],['Produtos abaixo do mínimo',d.products_below_minimum||0],['Vendas importadas (30 dias)',Number(d.sales_net_total_30d||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})],['Não conformidades abertas',d.open_nonconformities||0],['Ordens de manutenção abertas',d.open_maintenance_orders||0]];app.innerHTML=`<div class="pagehead"><div><h1>Visão geral</h1><div class="sub">Indicadores consolidados da unidade selecionada</div></div><span class="pill">Dados do Supabase</span></div><div class="grid">${kpis.map(([a,b])=>`<div class="card kpi"><small>${a}</small><b>${safe(b)}</b></div>`).join('')}</div><div class="section notice">Os indicadores começam a aparecer conforme os registros reais forem cadastrados. Nenhum dado demonstrativo foi misturado ao banco.</div>`;return}
if(currentPage==='cadastros'){
const tabs=[['products','Produtos'],['suppliers','Fornecedores'],['employees','Funcionários'],['users','Usuários'],['external_users','Usuários externos'],['structures','Estruturas'],['agreements','Convênios'],['services','Serviços']];

 products:{table:'products',title:'Produtos',fields:[['name','Nome do produto','text',true],['category','Categoria','text',false],['unit_measure','Unidade de medida','select',true,['UN','KG','G','L','ML','CX','PCT','FD']],['minimum_stock','Estoque mínimo','number',false]],cols:[['name','Produto'],['unit_measure','Unidade'],['category','Categoria'],['minimum_stock','Estoque mínimo']]},
 suppliers:{table:'suppliers',title:'Fornecedores',fields:[['name','Razão social / nome','text',true],['document','CNPJ / CPF','text',false],['contact_name','Contato','text',false],['email','E-mail','email',false],['phone','Telefone','text',false]],cols:[['name','Fornecedor'],['document','Documento'],['contact_name','Contato'],['email','E-mail'],['phone','Telefone']]},
 employees:{table:'employees',title:'Funcionários',fields:[['full_name','Nome completo','text',true],['employee_code','Matrícula / código (opcional)','text',false],['email','E-mail','email',false],['phone','Telefone','text',false],['position_id','Cargo','select',false],['hire_date','Data de admissão','date',false],['employment_status','Situação','select',true,['active','inactive','on_leave']]],cols:[['employee_code','Matrícula'],['full_name','Funcionário'],['email','E-mail'],['employment_status','Situação']]},

 agreements:{table:'company_agreements',title:'Convênios',fields:[['name','Nome do convênio','text',true],['partner_name','Empresa parceira','text',false],['agreement_code','Código','text',false],['start_date','Início','date',false],['end_date','Fim','date',false],['notes','Observações','text',false]],cols:[['name','Convênio'],['partner_name','Parceiro'],['agreement_code','Código'],['start_date','Início'],['end_date','Fim']]},
 services:{table:'company_services',title:'Serviços',fields:[['name','Nome do serviço','text',true],['category','Categoria','text',false],['description','Descrição','text',false]],cols:[['name','Serviço'],['category','Categoria'],['description','Descrição']]}
};
const [positionsRes]=await Promise.all([supabase.from('job_positions').select('id,title,department,active').eq('company_id',companyId).eq('active',true).order('title')]);
const positions=positionsRes.data||[];
let rows=[],error=null,users=[];
if(tab==='users'){
 const {data:m,error:me}=await supabase.from('company_memberships').select('id,user_id,role,created_at').eq('company_id',companyId).order('created_at');error=me;
 if(!error&&m?.length){const {data:pr,error:pe}=await supabase.from('user_profiles').select('id,full_name,email').in('id',m.map(x=>x.user_id));error=pe;users=(m||[]).map(x=>({...x,profile:(pr||[]).find(y=>y.id===x.user_id)}));}
}else{
 const c=configs[tab];const {data,error:e}=await supabase.from(c.table).select('*').eq('company_id',companyId).order('created_at',{ascending:false}).limit(300);rows=data||[];error=e;
}
if(error){app.innerHTML=`<div class="notice">Erro ao carregar ${safe(tabs.find(x=>x[0]===tab)?.[1]||'cadastros')}: ${safe(error.message)}</div>`;return}
const activeCount=tab==='users'?users.length:rows.filter(x=>x.active!==false&&x.employment_status!=='inactive').length;
const makeInput=(field,value='')=>{const [key,label,type,required,opts]=field;let v=value??'';if(key==='position_id'){return `<div class="field"><label>${label}</label><select name="${key}"><option value="">Não informado</option>${positions.map(p=>`<option value="${p.id}" ${v===p.id?'selected':''}>${safe(p.title)}${p.department?' — '+safe(p.department):''}</option>`).join('')}</select></div>`}if(type==='select'){const options=key==='unit_measure'?opts.map(x=>[x,x]):key==='employment_status'?[['active','Ativo'],['inactive','Inativo'],['on_leave','Afastado']]:opts.map(x=>[x,x]);return `<div class="field"><label>${label}${required?' *':''}</label><select name="${key}" ${required?'required':''}>${options.map(([a,b])=>`<option value="${a}" ${v===a?'selected':''}>${b}</option>`).join('')}</select></div>`}return `<div class="field"><label>${label}${required?' *':''}</label><input name="${key}" type="${type}" value="${safe(v)}" ${required?'required':''} ${type==='number'?'min="0" step="0.001"':''}></div>`};

const display=(v)=>v===null||v===undefined||v===''?'—':safe(v);
let listHtml='';
if(tab==='users'){
 listHtml=`<div class="tablewrap"><table><thead><tr><th>Nome</th><th>E-mail</th><th>Perfil</th><th>Ação</th></tr></thead><tbody>${users.map(u=>`<tr><td>${display(u.profile?.full_name)}</td><td>${display(u.profile?.email)}</td><td><select class="user-role" data-id="${u.id}"><option value="admin" ${u.role==='admin'?'selected':''}>Administrador</option><option value="manager" ${u.role==='manager'?'selected':''}>Gerente</option><option value="employee" ${u.role==='employee'?'selected':''}>Colaborador</option></select></td><td><button class="secondary" data-action="save-role" data-id="${u.id}">Salvar perfil</button></td></tr>`).join('')}</tbody></table>${users.length?'':'<div class="empty">Nenhum usuário vinculado.</div>'}</div>`;
}else{
 const cfg=configs[tab];listHtml=`<div class="tablewrap"><table><thead><tr>${cfg.cols.map(x=>`<th>${x[1]}</th>`).join('')}<th>Status</th><th>Ações</th></tr></thead><tbody>${rows.map(x=>`<tr>${cfg.cols.map(([k])=>`<td>${display(k==='employment_status'?({active:'Ativo',inactive:'Inativo',on_leave:'Afastado'}[x[k]]):x[k])}</td>`).join('')}<td>${x.active===false||x.employment_status==='inactive'?'<span class="pill">Inativo</span>':'<span class="pill green">Ativo</span>'}</td><td><button class="secondary" data-action="edit" data-id="${x.id}">Editar</button> <button class="secondary" data-action="toggle" data-id="${x.id}">${x.active===false||x.employment_status==='inactive'?'Ativar':'Inativar'}</button></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">Nenhum registro encontrado.</div>'}</div>`;
}

<div class="toolbar" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px">${tabs.map(([k,label])=>`<button type="button" class="${tab===k?'':'secondary'}" data-tab="${k}">${label}</button>`).join('')}</div>
${tab==='users'?`<div class="card section"><h3>Vincular usuário já registrado</h3><p class="muted">A pessoa precisa criar a própria conta no GestorPro antes. Depois, informe o UUID da conta para vinculá-la à empresa. O cadastro de senha não é feito nesta tela.</p><form id="userLinkForm"><div class="grid" style="grid-template-columns:2fr 1fr"><div class="field"><label>UUID do usuário *</label><input name="user_id" required placeholder="UUID da conta registrada"></div><div class="field"><label>Perfil *</label><select name="role"><option value="employee">Colaborador</option><option value="manager">Gerente</option><option value="admin">Administrador</option></select></div></div><button type="submit">Vincular usuário</button><div id="cadStatus" class="status"></div></form><hr style="border:0;border-top:1px solid var(--line);margin:18px 0"><h3>Conceder acesso a uma unidade</h3><form id="unitAccessForm"><div class="grid" style="grid-template-columns:2fr 1fr"><div class="field"><label>UUID do usuário vinculado *</label><input name="user_id" required placeholder="UUID do usuário"></div><div class="field"><label>Unidade *</label><select name="unit_id" required>${units.map(u=>`<option value="${u.id}">${safe(u.name)}</option>`).join('')}</select></div></div><button type="submit">Conceder acesso</button><div id="unitAccessStatus" class="status"></div></form></div>`:`<div class="card section"><div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap"><h3>${configs[tab].title}</h3><button type="button" id="newCadBtn">+ Novo ${configs[tab].title.toLowerCase().replace(/s$/,'')}</button></div><form id="cadForm" class="hidden"><input type="hidden" name="id"><div class="grid" style="grid-template-columns:repeat(2,minmax(0,1fr))">${formFields(configs[tab])}</div><div class="authactions"><button type="submit" id="cadSaveBtn">Salvar cadastro</button><button type="button" class="secondary" id="cadCancelBtn">Cancelar</button></div><div id="cadStatus" class="status"></div></form></div>`}
<div class="card section"><h3>${tab==='users'?'Usuários vinculados':configs[tab].title+' cadastrados'}</h3>${listHtml}</div>`;
app.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{window.gpCadTab=b.dataset.tab;render()}));
if(tab==='users'){
 $('userLinkForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await supabase.from('company_memberships').insert({company_id:companyId,user_id:String(f.get('user_id')).trim(),role:String(f.get('role'))});const el=$('cadStatus');el.textContent=error?'Não foi possível vincular: '+error.message:'Usuário vinculado com sucesso.';el.className='status '+(error?'red':'green');if(!error)await render()});
 $('unitAccessForm').addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(e.currentTarget);const {error}=await supabase.from('user_unit_access').insert({company_id:companyId,user_id:String(f.get('user_id')).trim(),unit_id:String(f.get('unit_id')),assigned_by:session.user.id});const el=$('unitAccessStatus');el.textContent=error?'Não foi possível conceder acesso: '+error.message:'Acesso à unidade concedido.';el.className='status '+(error?'red':'green')});
 app.querySelectorAll('[data-action="save-role"]').forEach(b=>b.addEventListener('click',async()=>{const role=app.querySelector(`.user-role[data-id="${b.dataset.id}"]`).value;const {error}=await supabase.from('company_memberships').update({role}).eq('id',b.dataset.id);if(error)alert('Erro ao atualizar perfil: '+error.message);else await render()}));
}else{
 const cfg=configs[tab],form=$('cadForm');$('newCadBtn').addEventListener('click',()=>{form.reset();form.elements.id.value='';form.classList.remove('hidden');$('cadStatus').textContent='';form.scrollIntoView({behavior:'smooth',block:'start'})});$('cadCancelBtn').addEventListener('click',()=>form.classList.add('hidden'));
 form.addEventListener('submit',async e=>{e.preventDefault();const f=new FormData(form);const payload={company_id:companyId};cfg.fields.forEach(([key,,type])=>{let val=f.get(key);payload[key]=val===''?null:(type==='number'?Number(val):String(val).trim())});if(tab==='employees'){payload.unit_id=unitId;if(!payload.employee_code)payload.employee_code='EMP-'+Date.now().toString().slice(-7);if(!payload.employment_status)payload.employment_status='active'}if(tab==='products'){payload.minimum_stock=payload.minimum_stock??0;payload.active=true}if(['suppliers','external_users','job_positions','company_agreements','company_services'].includes(cfg.table))payload.active=true;
 const id=f.get('id');const q=id?supabase.from(cfg.table).update(payload).eq('id',id):supabase.from(cfg.table).insert(payload);const {error}=await q;if(error){$('cadStatus').textContent='Erro ao salvar: '+error.message;$('cadStatus').className='status red';return}await render()});
 app.querySelectorAll('[data-action="edit"]').forEach(b=>b.addEventListener('click',()=>{const item=rows.find(x=>x.id===b.dataset.id);form.reset();form.elements.id.value=item.id;cfg.fields.forEach(([key])=>{if(form.elements[key])form.elements[key].value=item[key]??''});form.classList.remove('hidden');form.scrollIntoView({behavior:'smooth',block:'start'})}));
 app.querySelectorAll('[data-action="toggle"]').forEach(b=>b.addEventListener('click',async()=>{const item=rows.find(x=>x.id===b.dataset.id);const isActive=tab==='employees'?item.employment_status!=='inactive':item.active!==false;const patch=tab==='employees'?{employment_status:isActive?'inactive':'active'}:{active:!isActive};const {error}=await supabase.from(cfg.table).update(patch).eq('id',item.id);if(error)alert('Não foi possível alterar o status: '+error.message);else await render()}));
}
return}
if(currentPage==='estoque'){const {data,error}=await supabase.from('stock_balances').select('*').eq('unit_id',unitId).limit(100);app.innerHTML=error?`<div class="notice">Erro ao consultar estoque: ${safe(error.message)}</div>`:`<div class="pagehead"><div><h1>Controle de estoque</h1><div class="sub">Saldos gravados no banco por unidade</div></div></div>${table(['Registro'],(data||[]).map(x=>`<tr><td>${safe(JSON.stringify(x))}</td></tr>`).join(''))}`;return}
if(currentPage==='compras'){app.innerHTML='<div class="pagehead"><div><h1>Compras</h1><div class="sub">Pedidos e cotações serão ativados na próxima etapa de integração.</div></div></div><div class="notice">O banco já possui estrutura de compras, mas esta tela ainda não grava pedidos. Não utilize planilhas locais como registro oficial.</div>';return}
if(currentPage==='operacao'){app.innerHTML='<div class="pagehead"><div><h1>Operações</h1><div class="sub">Inventários, recebimentos, qualidade, RH e manutenção.</div></div></div><div class="notice">As tabelas e regras do backend estão preparadas; as telas operacionais serão conectadas módulo a módulo e testadas antes do uso real.</div>';return}
if(currentPage==='ajuda'){app.innerHTML='<div class="card"><h2>GestorPro conectado ao Supabase</h2><p>Login real, sessão autenticada, empresa, unidade e leitura do dashboard estão integrados nesta primeira etapa.</p><p class="notice">Ainda não é uma versão pronta para operação: cadastros, estoque, compras, recebimento e demais processos precisam de suas telas de gravação, validação e testes.</p></div>';return}}
supabase.auth.onAuthStateChange((_event,s)=>{if(!s){session=null;show('authView')} });
const {data:{session:initial}}=await supabase.auth.getSession();if(initial){session=initial;await bootstrap()}else{show('authView')}
</script>
</body></html>
