  const losses=data||[],lossValue=losses.reduce((sum,x)=>sum+Number(x.quantity)*Number(x.unit_cost),0),lossQty=losses.reduce((sum,x)=>sum+Number(x.quantity),0),reasonTotals=new Map();losses.forEach(x=>reasonTotals.set(x.reason,(reasonTotals.get(x.reason)||0)+Number(x.quantity)*Number(x.unit_cost)));const topReason=[...reasonTotals.entries()].sort((a,b)=>b[1]-a[1])[0];

 function bindInsert(tableName,build){
  const form=$('hrForm');if(!form)return;
  form.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(form),raw={};for(const [k,v] of fd.entries())raw[k]=String(v).trim();
   let payload;try{payload=build(raw)}catch(err){$('hrStatus').textContent=err.message;$('hrStatus').className='status red';return}
   const {error}=await supabase.from(tableName).insert(payload);if(error){$('hrStatus').textContent='Não foi possível salvar: '+error.message;$('hrStatus').className='status red';return}
   $('hrStatus').textContent='Registro salvo com sucesso.';$('hrStatus').className='status green';form.reset();await render();
  });
 }
}
